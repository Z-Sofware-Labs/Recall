<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recall</title>
    <meta name="description" content="Recall - Course, Quiz, and Certificate Manager" />
    <meta property="og:title" content="Recall" />
    <meta property="og:description" content="Recall - Course, Quiz, and Certificate Manager" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          const savedTheme = localStorage.getItem('theme');
          const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}

        // Tauri Web / Mobile browser runtime fallback shim
        if (typeof window !== 'undefined' && !window.__TAURI_INTERNALS__) {
          window.__TAURI_INTERNALS__ = {
            invoke: function(cmd, args, options) {
              return Promise.reject(new Error('[Recall Browser Mode] Native IPC command "' + cmd + '" is unavailable in web/mobile browser mode.'));
            },
            convertFileSrc: function(filePath, protocol) {
              return filePath || '';
            },
            transformCallback: function(callback, once) {
              return 0;
            },
            unregisterCallback: function(id) {},
            metadata: {
              currentWindow: { label: 'main' }
            }
          };
        }
      })();
    </script>
    <style>
      html, body {
        background-color: #ffffff;
      }
      html.dark, html.dark body {
        background-color: #020617;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
